[project]
name = "backend"
version = "0.1.0"
description = "Club Management System Backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=0.34.0",
    "aiofiles>=23.2.1",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "bcrypt==4.0.1",
    "diffusers>=0.29.0",
    "email-validator>=2.1.0",
    "fastapi>=0.109.0",
    "fpdf2>=2.8.5",
    "httpx>=0.28.1",
    "huggingface-hub>=0.23.0",
    "numpy<2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "peft>=0.12.0",
    "pillow>=10.2.0",
    "psutil>=5.9.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.1.0",
    "python-dateutil>=2.9.0.post0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "safetensors>=0.4.2",
    "sentence-transformers>=2.6.0",
    "sqlalchemy>=2.0.0",
    "torch>=2.4.0", # CPU version (via index below)
    "torchaudio>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
    "uvicorn[standard]>=0.27.0",
]

# Force PyTorch to use the CPU-specific repository
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
