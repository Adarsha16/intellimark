[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend with Stable Diffusion support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate==0.27.2",
    "aiofiles>=25.1.0",
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "diffusers==0.27.2",
    "email-validator>=2.3.0",
    "fastapi>=0.124.4",
    "huggingface_hub==0.20.3",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "safetensors==0.4.2",
    "sqlalchemy>=2.0.45",
    "tokenizers==0.15.2",
    "torch==2.1.0",
    "torchaudio==2.1.0",
    "torchvision==0.16.0",
    "transformers==4.38.2",
    "uvicorn[standard]>=0.38.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }